<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karmī — Enterprise HR, Payroll & Attendance Software (v11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f3f8; --surface:#FFFFFF; --surface-alt:#f8fafc;
    --ink:#1e293b; --ink-muted:#64748b; --accent:#2563eb; --accent-dark:#1d4ed8;
    --accent-bg:#eff6ff; --success:#10b981; --success-bg:#ecfdf5;
    --danger:#ef4444; --danger-bg:#fef2f2; --warn:#f59e0b; --warn-bg:#fffbeb;
    --border:#cbd5e1; --radius:8px; --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;margin:0;padding:0;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;}
  
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:var(--radius);cursor:pointer;font-weight:600;transition:all .15s ease;font-size:13px;}
  .btn:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);color:#fff;}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-danger:hover{background:#dc2626;color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);padding:5px 10px;}
  .btn-ghost:hover{color:var(--accent);background:var(--accent-bg);}
  .btn-block{width:100%;}
  .btn-sm{padding:4px 8px;font-size:12px;}
  
  input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--ink);font-size:13.5px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37, 99, 235, 0.15);}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink-muted);margin-bottom:4px;text-transform:uppercase;}
  .field{margin-bottom:12px;}
  
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
  .badge-present{background:var(--success-bg);color:var(--success);}
  .badge-late{background:var(--warn-bg);color:var(--warn);}
  .badge-absent{background:var(--danger-bg);color:var(--danger);}
  
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--ink-muted);font-weight:700;padding:10px;border-bottom:2px solid var(--border);text-transform:uppercase;background:#f8fafc;}
  td{padding:10px;border-bottom:1px solid #f1f5f9;font-size:13px;color:var(--ink);}
  .table-wrap{overflow-x:auto;}
  .empty-state{padding:30px;text-align:center;color:var(--ink-muted);font-weight:500;}
  
  .modal-backdrop{position:fixed;inset:0;background:rgba(15, 23, 42, 0.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;}
  
  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);}
  
  .row{display:flex;gap:12px;} .row > *{flex:1;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--ink-muted);}

  .topbar{background:#1e293b;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:#fff;}
  .brand .mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
  .clock{font-weight:600;color:#94a3b8;font-size:12px;background:#0f172a;padding:5px 10px;border-radius:15px;border:1px solid #334155;}

  .shell{display:flex;min-height:calc(100vh - 53px);}
  .sidebar{width:230px;flex-shrink:0;background:#ffffff;border-right:1px solid var(--border);padding:12px 8px;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius);color:var(--ink-muted);cursor:pointer;font-weight:600;font-size:13px;margin-bottom:3px;}
  .nav-item:hover{background:var(--surface-alt);color:var(--ink);}
  .nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:700;}
  .main{flex:1;padding:20px;min-width:0;background:var(--bg);}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%);}
  
  .checkbtn{width:100%;padding:14px;border-radius:var(--radius);border:none;cursor:pointer;font-weight:800;font-size:16px;color:#fff;margin-top:10px;}
  .checkbtn.in{background:var(--success);}
  .checkbtn.out{background:var(--danger);}
  .checkbtn.done{background:var(--ink-muted);cursor:default;}

  .dash-header-card{background:linear-gradient(135deg, #1e293b 0%, #334155 100%);color:#fff;padding:22px;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);margin-bottom:16px;}
  .stat-card-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);flex:1;}
  .stat-card-box .title{font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;margin-bottom:4px;}
  .stat-card-box .val{font-size:22px;font-weight:800;color:var(--accent);}
  .dept-tile{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:14px;flex:1;box-shadow:var(--shadow);border-top:4px solid var(--accent);}
  
  @media print{ .topbar,.sidebar,.no-print{display:none !important;} .main{padding:0;background:#fff;} body{background:#fff;} .panel{box-shadow:none;border:none;} }
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:#64748b;">System Initializing...</div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
let state = {
  employees: [], attendance: [], requests: [], loans: [], regularizations: [], shifts: [], weekoffs: [], salarySlips: [],
  settings: { companyName:'TOUCHSTONE SERVICES PVT. LTD.', currency:'₹' },
  session: null, adminPage: 'dashboard', managerPage: 'dashboard', empPage: 'dashboard', loaded: false
};

function getKey(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;} }
function setKey(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

/* STORAGE KEY UPGRADED TO V11 */
function initData(){
  state.employees = getKey('ts_emp_v11') || [
    { id:'EMP001', name:'Admin Director', pass:'1234', role:'admin', department:'Management', designation:'Director', managerId:'', status:'Active', salary:{basic:40000, hra:16000, education:2000, market:3000, conveyance:1600, bonus:3332, compPfAdmin:500, compPf:1800, compEsic:0, tds:2000, insurance:500, lwf:200, empPf:1800, empEsic:0} },
    { id:'EMP002', name:'Rahul Manager', pass:'1234', role:'manager', department:'Engineering', designation:'Engineering Manager', managerId:'EMP001', status:'Active', salary:{basic:30000, hra:12000, education:1500, market:2000, conveyance:1600, bonus:2500, compPfAdmin:400, compPf:1800, compEsic:0, tds:1200, insurance:400, lwf:200, empPf:1800, empEsic:0} },
    { id:'EMP003', name:'Amit Developer', pass:'1234', role:'employee', department:'Engineering', designation:'Software Dev', managerId:'EMP002', status:'Active', salary:{basic:22000, hra:8800, education:1000, market:1500, conveyance:1600, bonus:1833, compPfAdmin:300, compPf:1800, compEsic:0, tds:500, insurance:300, lwf:200, empPf:1800, empEsic:0} }
  ];
  state.attendance = getKey('ts_att_v11') || [];
  state.requests = getKey('ts_req_v11') || [];
  state.loans = getKey('ts_loan_v11') || [];
  state.regularizations = getKey('ts_reg_v11') || [];
  state.shifts = getKey('ts_shift_v11') || [];
  state.weekoffs = getKey('ts_weekoff_v11') || [];
  state.salarySlips = getKey('ts_sal_slips_v11') || [];
  state.session = getKey('ts_sess_v11');
  state.loaded = true;
}

function saveAll(){
  setKey('ts_emp_v11', state.employees);
  setKey('ts_att_v11', state.attendance);
  setKey('ts_req_v11', state.requests);
  setKey('ts_loan_v11', state.loans);
  setKey('ts_reg_v11', state.regularizations);
  setKey('ts_shift_v11', state.shifts);
  setKey('ts_weekoff_v11', state.weekoffs);
  setKey('ts_sal_slips_v11', state.salarySlips);
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){
  const wrap = document.getElementById('toastWrap'); if(!wrap) return;
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  wrap.appendChild(t); setTimeout(()=>t.remove(), 3000);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function fmtTime(iso){ if(!iso)return'—'; return new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(s){ return s ? new Date(s+'T00:00:00').toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function fmtMoney(n){ return state.settings.currency + ' ' + Number(n||0).toLocaleString('en-IN'); }
function empName(id){ const e=state.employees.find(x=>x.id===id); return e?e.name:'—'; }

function calcSalary(sal){
  const basic = Number(sal?.basic)||20000;
  const hra = Number(sal?.hra)||Math.round(basic*0.40);
  const education = Number(sal?.education)||0;
  const market = Number(sal?.market)||0;
  const conveyance = Number(sal?.conveyance)||0;
  const bonus = Number(sal?.bonus)||Math.round(basic*0.0833);
  const compPfAdmin = Number(sal?.compPfAdmin)||0;
  const compPf = Number(sal?.compPf)||0;
  const compEsic = Number(sal?.compEsic)||0;

  const gross = basic + hra + education + market + conveyance + bonus + compPfAdmin + compPf + compEsic;

  const tds = Number(sal?.tds)||0;
  const insurance = Number(sal?.insurance)||0;
  const lwf = Number(sal?.lwf)||0;
  const empPf = Number(sal?.empPf)||Math.min(Math.round(basic * 0.12), 1800);
  const empEsic = Number(sal?.empEsic)||0;

  const totalDed = tds + insurance + lwf + empPf + empEsic;

  return { 
    basic, hra, education, market, conveyance, bonus, compPfAdmin, compPf, compEsic, gross, 
    tds, insurance, lwf, empPf, empEsic, totalDed 
  };
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded) return;
  if(!state.session){ app.innerHTML = renderAuth(); }
  else {
    const user = state.employees.find(x=>x.id===state.session.employeeId);
    if(!user || user.status === 'Left'){ doLogout(); toast('Your account is inactive or marked as left.'); return; }
    if(user.role==='admin') app.innerHTML = renderAdminShell(user);
    else if(user.role==='manager') app.innerHTML = renderManagerShell(user);
    else app.innerHTML = renderEmpShell(user);
  }
  attachEvents();
}

function renderAuth(){
  return `
    <div class="auth-wrap">
      <div style="width:100%;max-width:400px;">
        <div class="panel" style="padding:24px;">
          <div class="brand" style="color:#1e293b;margin-bottom:20px;font-size:16px;">
            <div class="mark">T</div>${state.settings.companyName}
          </div>
          <div style="margin-bottom:16px;background:#f8fafc;padding:10px;border-radius:6px;border:1px solid #e2e8f0;font-size:12px;">
            <strong>Login Credentials Guide:</strong><br>
            • Admin: <code>EMP001</code> / <code>1234</code><br>
            • Manager: <code>EMP002</code> / <code>1234</code><br>
            • Employee: <code>EMP003</code> / <code>1234</code>
          </div>
          <div class="field">
            <label>Employee ID</label>
            <input type="text" id="l_id" placeholder="Enter Employee ID (e.g. EMP001)" style="text-transform:uppercase;">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="l_pass" placeholder="Enter Password" value="1234">
          </div>
          <button class="btn btn-primary btn-block" data-act="login" style="margin-top:10px;padding:10px;">Login to System</button>
        </div>
      </div>
    </div>
  `;
}

function doLogin(){
  const idInput = (document.getElementById('l_id')?.value || '').trim();
  const passInput = (document.getElementById('l_pass')?.value || '').trim();
  if(!idInput){ toast('Please enter your Employee ID'); return; }
  const emp = state.employees.find(x=>x.id.toLowerCase()===idInput.toLowerCase() && x.pass===passInput);
  if(!emp){ toast('Invalid Employee ID or Password'); return; }
  if(emp.status === 'Left'){ toast('This account is marked as Left/Inactive.'); return; }
  state.session = { role: emp.role, employeeId: emp.id };
  setKey('ts_sess_v11', state.session);
  toast('Welcome back, ' + emp.name); render();
}

function doLogout(){ state.session=null; setKey('ts_sess_v11',null); render(); }

const EMP_NAV = [
  {key:'dashboard', label:'Check-In / Out (GPS)'},
  {key:'attendance', label:'My Attendance'},
  {key:'regularize', label:'Attendance Regularize'},
  {key:'leaves', label:'Leave Applications'},
  {key:'loans', label:'Loan & Advance'},
  {key:'payslip', label:'Salary Payslip'}
];

function renderEmpShell(emp){
  let content = '';
  if(state.empPage==='dashboard') content = renderEmpDash(emp);
  else if(state.empPage==='attendance') content = renderEmpAtt(emp);
  else if(state.empPage==='regularize') content = renderEmpReg(emp);
  else if(state.empPage==='leaves') content = renderEmpLeaves(emp);
  else if(state.empPage==='loans') content = renderEmpLoans(emp);
  else if(state.empPage==='payslip') content = renderEmpPayslip(emp, window.selectedEmpPayslipMonth || monthStr());

  return `
    <div class="topbar">
      <div class="brand"><div class="mark">T</div>${state.settings.companyName} — Employee</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="clock" id="liveClock"></div>
        <span style="font-weight:600;font-size:13px;">${emp.name} (${emp.id})</span>
        <button class="btn btn-sm btn-danger" data-act="logout">Logout</button>
      </div>
    </div>
    <div class="shell">
      <div class="sidebar">${EMP_NAV.map(n=>`<div class="nav-item ${state.empPage===n.key?'active':''}" data-enav="${n.key}">${n.label}</div>`).join('')}</div>
      <div class="main">${content}</div>
    </div>
  `;
}

function renderEmpDash(emp){
  const today = todayStr();
  const rec = state.attendance.find(a=>a.employeeId===emp.id && a.date===today);
  let btnHtml = '';
  if(!rec) btnHtml = `<button class="checkbtn in" data-act="checkin">Check In with GPS Location</button>`;
  else if(!rec.checkOut) btnHtml = `<button class="checkbtn out" data-act="checkout">Check Out Now</button>`;
  else btnHtml = `<button class="checkbtn done" disabled>Shift Completed for Today</button>`;

  return `
    <div style="max-width:480px;margin:20px auto;">
      <h3 style="margin-bottom:12px;">Welcome, ${emp.name}</h3>
      <div class="panel" style="text-align:center;">
        <div style="font-size:32px;font-weight:800;margin-bottom:4px;" id="dashTime">--:--:--</div>
        <div class="muted" style="margin-bottom:14px;">${new Date().toLocaleDateString('en-US',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>
        ${btnHtml}
        <div class="status-line" style="margin-top:14px;font-size:13px;">
          ${rec ? `Check-In: <strong>${fmtTime(rec.checkIn)}</strong><br>📍 Location: <strong>${rec.location || 'Raipur'}</strong><br>${rec.checkOut?`Check-Out: <strong>${fmtTime(rec.checkOut)}</strong>`:''}` : 'Not checked in yet today.'}
        </div>
      </div>
    </div>
  `;
}

function renderEmpAtt(emp){
  const recs = state.attendance.filter(a=>a.employeeId===emp.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <h3 style="margin-bottom:14px;">My Attendance Records</h3>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Location</th><th>Status</th></tr></thead>
      <tbody>${recs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${fmtTime(r.checkIn)}</td><td>${fmtTime(r.checkOut)}</td><td><small>📍 ${r.location || 'Raipur'}</small></td><td><span class="badge badge-present">${r.status}</span></td></tr>`).join('') || '<tr><td colspan="5"><div class="empty-state">No attendance records</div></td></tr>'}</tbody>
    </table></div></div>
  `;
}

function renderEmpReg(emp){
  const myRegs = state.regularizations.filter(r=>r.employeeId===emp.id);
  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <h3 style="margin:0;">Attendance Regularization</h3>
      <button class="btn btn-primary" data-act="openRegModal">+ Apply Regularization</button>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Requested Status</th><th>Reason</th><th>Status</th></tr></thead>
      <tbody>${myRegs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td><span class="badge badge-present">${r.requestedStatus}</span></td><td>${r.reason}</td><td><span class="badge ${r.status==='Approved'?'badge-present':'badge-late'}">${r.status}</span></td></tr>`).join('') || '<tr><td colspan="4"><div class="empty-state">No requests</div></td></tr>'}</tbody>
    </table></div></div>
  `;
}

function renderEmpLeaves(emp){
  const myReqs = state.requests.filter(r=>r.employeeId===emp.id);
  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <h3 style="margin:0;">Leave Applications</h3>
      <button class="btn btn-primary" data-act="openLeaveModal">+ Apply Leave</button>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>From Date</th><th>To Date</th><th>Reason</th><th>Status</th></tr></thead>
      <tbody>${myReqs.map(r=>`<tr><td>${fmtDate(r.fromDate)}</td><td>${fmtDate(r.toDate)}</td><td>${r.reason}</td><td><span class="badge ${r.status==='Approved'?'badge-present':'badge-late'}">${r.status}</span></td></tr>`).join('') || '<tr><td colspan="4"><div class="empty-state">No leave applications</div></td></tr>'}</tbody>
    </table></div></div>
  `;
}

function renderEmpLoans(emp){
  const myLoans = state.loans.filter(l=>l.employeeId===emp.id);
  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <h3 style="margin:0;">Advance & Loan Requests</h3>
      <button class="btn btn-primary" data-act="openLoanModal">+ Request Advance / Loan</button>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>From Date</th><th>To Date</th><th>Amount</th><th>Reason</th><th>Status</th></tr></thead>
      <tbody>${myLoans.map(l=>`<tr><td>${fmtDate(l.fromDate)}</td><td>${fmtDate(l.toDate)}</td><td><strong>${fmtMoney(l.amount)}</strong></td><td>${l.reason}</td><td><span class="badge ${l.status==='Approved'?'badge-present':'badge-late'}">${l.status}</span></td></tr>`).join('') || '<tr><td colspan="5"><div class="empty-state">No loan requests</div></td></tr>'}</tbody>
    </table></div></div>
  `;
}

function renderEmpPayslip(emp, selectedMonth){
  const mySlips = state.salarySlips.filter(s=>s.employeeId===emp.id).sort((a,b)=>b.month.localeCompare(a.month));
  
  if(mySlips.length === 0){
    return `
      <div class="flex-between" style="margin-bottom:14px;">
        <h3 style="margin:0;">Salary Payslip</h3>
      </div>
      <div class="panel">
        <div class="empty-state">
          No salary slip has been generated and published by the admin for your account yet.
        </div>
      </div>
    `;
  }

  const activeMonth = selectedMonth || mySlips[0].month;
  const slip = mySlips.find(s=>s.month===activeMonth) || mySlips[0];

  return `
    <div class="flex-between" style="margin-bottom:14px;">
      <h3 style="margin:0;">Salary Payslip (${slip.month})</h3>
      <div style="display:flex;gap:10px;align-items:center;">
        <select id="payslipMonthSelect" style="width:auto;padding:6px 10px;">
          ${mySlips.map(s=>`<option value="${s.month}" ${s.month===slip.month?'selected':''}>${s.month}</option>`).join('')}
        </select>
        <button class="btn btn-primary" onclick="window.print()">Print Payslip</button>
      </div>
    </div>
    <div class="panel" style="max-width:620px;margin:0 auto;border:2px solid var(--border);">
      <div style="text-align:center;border-bottom:2px solid var(--border);padding-bottom:12px;margin-bottom:12px;">
        <h3 style="margin:0;color:var(--accent);">${state.settings.companyName}</h3>
        <p class="muted" style="margin:4px 0 0;">Official Salary Slip for ${slip.month} — ${emp.name} (${emp.designation})</p>
      </div>
      <table>
        <tr><th>Earnings</th><th style="text-align:right;">Amount</th></tr>
        <tr><td>Basic Salary</td><td style="text-align:right;">${fmtMoney(slip.basic)}</td></tr>
        <tr><td>House Rent Allowances (HRA)</td><td style="text-align:right;">${fmtMoney(slip.hra)}</td></tr>
        <tr><td>Education Allowance</td><td style="text-align:right;">${fmtMoney(slip.education)}</td></tr>
        <tr><td>Market Allowance</td><td style="text-align:right;">${fmtMoney(slip.market)}</td></tr>

function handleSystemBackup(){
  const backupData = {
    version: 'v11',
    timestamp: new Date().toISOString(),
    data: {
      ts_emp_v11: getKey('ts_emp_v11'),
      ts_att_v11: getKey('ts_att_v11'),
      ts_req_v11: getKey('ts_req_v11'),
      ts_loan_v11: getKey('ts_loan_v11'),
      ts_reg_v11: getKey('ts_reg_v11'),
      ts_shift_v11: getKey('ts_shift_v11'),
      ts_weekoff_v11: getKey('ts_weekoff_v11'),
      ts_sal_slips_v11: getKey('ts_sal_slips_v11')
    }
  };
  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `karm_backup_${todayStr()}.json`;
  a.click();
  toast('System Backup Downloaded Successfully!');
}

function handleSystemRestore(){
  const fileInput = document.getElementById('restoreFile');
  if(!fileInput.files || fileInput.files.length === 0){
    toast('Please select a backup JSON file first!');
    return;
  }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed.data){
        toast('Invalid backup file structure!');
        return;
      }
      const d = parsed.data;
      if(d.ts_emp_v11) setKey('ts_emp_v11', d.ts_emp_v11);
      if(d.ts_att_v11) setKey('ts_att_v11', d.ts_att_v11);
      if(d.ts_req_v11) setKey('ts_req_v11', d.ts_req_v11);
      if(d.ts_loan_v11) setKey('ts_loan_v11', d.ts_loan_v11);
      if(d.ts_reg_v11) setKey('ts_reg_v11', d.ts_reg_v11);
      if(d.ts_shift_v11) setKey('ts_shift_v11', d.ts_shift_v11);
      if(d.ts_weekoff_v11) setKey('ts_weekoff_v11', d.ts_weekoff_v11);
      if(d.ts_sal_slips_v11) setKey('ts_sal_slips_v11', d.ts_sal_slips_v11);

      initData();
      render();
      toast('System Data Restored Successfully!');
    } catch(err){
      toast('Error reading backup file. Please ensure it is a valid JSON.');
    }
  };
  reader.readAsText(file);
}

function exportSingleReport(type){
  let csv = '';
  let filename = '';
  if(type==='employee'){
    csv = 'Emp ID,Name,Role,Status,Designation,Basic,HRA,Gross\n';
    state.employees.forEach(e=>{
      const sal = calcSalary(e.salary);
      csv += `"${e.id}","${e.name}","${e.role}","${e.status||'Active'}","${e.designation}",${sal.basic},${sal.hra},${sal.gross}\n`;
    });
    filename = 'Employee_Report';
  } else if(type==='leave'){
    csv = 'Emp ID,Name,From Date,To Date,Reason,Status\n';
    state.requests.forEach(r=>{
      csv += `"${r.employeeId}","${empName(r.employeeId)}","${r.fromDate}","${r.toDate}","${r.reason}","${r.status}"\n`;
    });
    filename = 'Leave_Report';
  } else if(type==='loan'){
    csv = 'Emp ID,Name,From Date,To Date,Amount,Reason,Status\n';
    state.loans.forEach(l=>{
      csv += `"${l.employeeId}","${empName(l.employeeId)}","${l.fromDate}","${l.toDate}",${l.amount},"${l.reason}","${l.status}"\n`;
    });
    filename = 'Loan_Report';
  } else if(type==='regularization'){
    csv = 'Emp ID,Name,Date,Requested Status,Reason,Status\n';
    state.regularizations.forEach(rg=>{
      csv += `"${rg.employeeId}","${empName(rg.employeeId)}","${rg.date}","${rg.requestedStatus}","${rg.reason}","${rg.status}"\n`;
    });
    filename = 'Regularization_Report';
  } else if(type==='shift'){
    csv = 'Emp ID,Name,Shift Name,Timing,Effective Date\n';
    state.shifts.forEach(s=>{
      csv += `"${s.employeeId}","${empName(s.employeeId)}","${s.shiftName}","${s.timing}","${s.date}"\n`;
    });
    filename = 'Shift_Report';
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filename}_${todayStr()}.csv`;
  a.click();
  toast(`${filename} Downloaded Successfully!`);
}

function attachEvents(){
  setInterval(()=>{
    const d = new Date().toLocaleTimeString();
    ['liveClock','liveClockAdmin','liveClockManager','dashTime'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=d; });
  }, 1000);

  const psSelect = document.getElementById('payslipMonthSelect');
  if(psSelect){
    psSelect.onchange = (e) => {
      window.selectedEmpPayslipMonth = e.target.value;
      render();
    };
  }

  document.body.onclick = (e)=>{
    const t = e.target;
    if(t.dataset.act==='login'){ doLogin(); return; }
    if(t.dataset.act==='logout'){ doLogout(); return; }
    if(t.dataset.enav){ state.empPage = t.dataset.enav; render(); return; }
    if(t.dataset.anav){ state.adminPage = t.dataset.anav; render(); return; }
    if(t.dataset.mnav){ state.managerPage = t.dataset.mnav; render(); return; }
    if(t.dataset.export){ exportSingleReport(t.dataset.export); return; }
    if(t.dataset.act==='systemBackup'){ handleSystemBackup(); return; }
    if(t.dataset.act==='systemRestore'){ handleSystemRestore(); return; }

    // Password reset modal trigger
    if(t.dataset.resetpass){
      openResetPasswordModal(t.dataset.resetpass);
      return;
    }

    // Toggle Left / Active status
    if(t.dataset.toggleleft){
      const emp = state.employees.find(x=>x.id===t.dataset.toggleleft);
      if(emp){
        emp.status = (emp.status === 'Left') ? 'Active' : 'Left';
        saveAll();
        toast(`Employee ${emp.name} marked as ${emp.status}`);
        render();
      }
      return;
    }

    if(t.dataset.act==='saveNewPass'){
      const id = t.dataset.id;
      const newPass = document.getElementById('new_admin_pass').value;
      if(!newPass){ toast('Please enter new password'); return; }
      const emp = state.employees.find(x=>x.id===id);
      if(emp){
        emp.pass = newPass;
        saveAll();
        closeModal();
        toast(`Password successfully updated for ${emp.name}!`);
        render();
      }
      return;
    }

    if(t.dataset.act==='generateAllSlips'){
      const targetMonth = document.getElementById('gen_target_month').value;
      if(!targetMonth){ toast('Please select a valid month'); return; }
      
      state.employees.filter(e=>e.status!=='Left').forEach(emp => {
        const existingIndex = state.salarySlips.findIndex(s => s.employeeId === emp.id && s.month === targetMonth);
        const sal = calcSalary(emp.salary);
        const loanDed = state.loans.filter(l => l.employeeId === emp.id && l.status === 'Approved').reduce((s,l)=>s+Number(l.amount||0),0);
        const totalDed = sal.totalDed + loanDed;
        const net = sal.gross - totalDed;

        const slipData = {
          id: genId(),
          employeeId: emp.id,
          month: targetMonth,
          basic: sal.basic,
          hra: sal.hra,
          education: sal.education,
          market: sal.market,
          conveyance: sal.conveyance,
          bonus: sal.bonus,
          compPfAdmin: sal.compPfAdmin,
          compPf: sal.compPf,
          compEsic: sal.compEsic,
          gross: sal.gross,
          tds: sal.tds,
          insurance: sal.insurance,
          lwf: sal.lwf,
          empPf: sal.empPf,
          empEsic: sal.empEsic,
          loanDed: loanDed,
          totalDed: sal.totalDed,
          net: net,
          dateGenerated: todayStr()
        };

        if(existingIndex >= 0){
          state.salarySlips[existingIndex] = slipData;
        } else {
          state.salarySlips.push(slipData);
        }
      });

      saveAll();
      toast(`Salary slips successfully generated & published for ${targetMonth}!`);
      render();
      return;
    }

    if(t.dataset.delslip){
      state.salarySlips = state.salarySlips.filter(s => s.id !== t.dataset.delslip);
      saveAll();
      toast('Salary slip unpublished / deleted.');
      render();
      return;
    }

    if(t.dataset.act==='checkin'){
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(async (pos)=>{
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          let locationStr = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if(data && data.address){
              const sub = data.address.suburb || data.address.neighbourhood || data.address.city_district || '';
              const city = data.address.city || data.address.town || data.address.state || '';
              locationStr = `${sub ? sub + ', ' : ''}${city} (GPS Verified)`;
            }
          } catch(err){}
          processAttendance(state.session.employeeId, todayStr(), new Date().toISOString(), 'checkin', locationStr);
        }, ()=>{
          processAttendance(state.session.employeeId, todayStr(), new Date().toISOString(), 'checkin', 'Raipur (GPS Fallback)');
        });
      } else {
        processAttendance(state.session.employeeId, todayStr(), new Date().toISOString(), 'checkin', 'Raipur');
      }
      return;
    }

    if(t.dataset.act==='checkout'){
      processAttendance(state.session.employeeId, todayStr(), new Date().toISOString(), 'checkout');
      return;
    }

    if(t.dataset.act==='openEmpModal'){ openEmpModal(null); return; }
    if(t.dataset.act==='openLeaveModal'){ openLeaveModal(); return; }
    if(t.dataset.act==='openLoanModal'){ openLoanModal(); return; }
    if(t.dataset.act==='openRegModal'){ openRegModal(); return; }
    if(t.dataset.act==='openAdminApplyLeaveModal'){ openAdminApplyLeaveModal(); return; }
    if(t.dataset.act==='openAdminApplyLoanModal'){ openAdminApplyLoanModal(); return; }
    if(t.dataset.act==='openAdminApplyRegModal'){ openAdminApplyRegModal(); return; }
    if(t.dataset.act==='openAdminApplyShiftModal'){ openAdminApplyShiftModal(); return; }
    if(t.dataset.act==='closeModal'){ closeModal(); return; }
    if(t.dataset.edit){ openEmpModal(state.employees.find(x=>x.id===t.dataset.edit)); return; }

    if(t.dataset.act==='submitLeave'){
      const fromDate = document.getElementById('modal_fdate').value;
      const toDate = document.getElementById('modal_tdate').value;
      const reason = document.getElementById('modal_lreason').value;
      if(!reason){ toast('Please enter reason'); return; }
      state.requests.push({ id: genId(), employeeId: state.session.employeeId, fromDate, toDate, reason, status:'Pending' });
      saveAll(); closeModal(); toast('Leave application submitted successfully!'); render();
      return;
    }

    if(t.dataset.act==='submitLoan'){
      const fromDate = document.getElementById('modal_lfdate').value;
      const toDate = document.getElementById('modal_ltdate').value;
      const amount = Number(document.getElementById('modal_lamount').value);
      const reason = document.getElementById('modal_lreason2').value;
      if(!amount){ toast('Please enter loan amount'); return; }
      state.loans.push({ id: genId(), employeeId: state.session.employeeId, fromDate, toDate, amount, reason, status:'Pending' });
      saveAll(); closeModal(); toast('Loan request submitted successfully!'); render();
      return;
    }

    if(t.dataset.act==='submitReg'){
      const date = document.getElementById('modal_rgdate').value;
      const requestedStatus = document.getElementById('modal_rgstatus').value;
      const reason = document.getElementById('modal_rgreason').value;
      if(!reason){ toast('Please enter reason'); return; }
      state.regularizations.push({ id: genId(), employeeId: state.session.employeeId, date, requestedStatus, reason, status:'Pending' });
      saveAll(); closeModal(); toast('Regularization request submitted successfully!'); render();
      return;
    }

    if(t.dataset.act==='adminSubmitLeave'){
      const employeeId = document.getElementById('adm_lemp').value;
      const fromDate = document.getElementById('adm_lf').value;
      const toDate = document.getElementById('adm_lt').value;
      const reason = document.getElementById('adm_lrs').value;
      state.requests.push({ id: genId(), employeeId, fromDate, toDate, reason, status:'Approved' });
      saveAll(); closeModal(); toast('Leave applied and auto-approved for employee!'); render();
      return;
    }

    if(t.dataset.act==='adminSubmitLoan'){
      const employeeId = document.getElementById('adm_loanemp').value;
      const fromDate = document.getElementById('adm_loanf').value;
      const toDate = document.getElementById('adm_loant').value;
      const amount = Number(document.getElementById('adm_loanamt').value);
      const reason = document.getElementById('adm_loanrs').value;
      if(!amount){ toast('Please enter amount'); return; }
      state.loans.push({ id: genId(), employeeId, fromDate, toDate, amount, reason, status:'Approved' });
      saveAll(); closeModal(); toast('Loan applied and auto-approved for employee!'); render();
      return;
    }

    if(t.dataset.act==='adminSubmitReg'){
      const employeeId = document.getElementById('adm_regemp').value;
      const date = document.getElementById('adm_regdate').value;
      const requestedStatus = document.getElementById('adm_regstatus').value;
      const reason = document.getElementById('adm_regrs').value;
      state.regularizations.push({ id: genId(), employeeId, date, requestedStatus, reason, status:'Approved' });
      saveAll(); closeModal(); toast('Regularization applied and auto-approved for employee!'); render();
      return;
    }

    if(t.dataset.act==='adminSubmitShift'){
      const employeeId = document.getElementById('adm_semp').value;
      const shiftName = document.getElementById('adm_sname').value;
      const weekoff = document.getElementById('adm_woff').value;
      const date = document.getElementById('adm_sdate').value;
      state.shifts.push({ id: genId(), employeeId, shiftName, timing: shiftName.includes('Morning')?'07:00 AM - 04:00 PM':'10:00 AM - 07:00 PM', date });
      state.weekoffs.push({ id: genId(), employeeId, day: weekoff, date });
      saveAll(); closeModal(); toast('Shift & Week-off updated successfully!'); render();
      return;
    }

    if(t.dataset.act==='saveEmp'){
      const id = t.dataset.id;
      const name = document.getElementById('m_name').value;
      const role = document.getElementById('m_role').value;
      const designation = document.getElementById('m_desig').value;
      const passInput = document.getElementById('m_pass') ? document.getElementById('m_pass').value : null;

      const basic = Number(document.getElementById('m_basic').value);
      const hra = Number(document.getElementById('m_hra').value);
      const education = Number(document.getElementById('m_education').value);
      const market = Number(document.getElementById('m_market').value);
      const conveyance = Number(document.getElementById('m_conveyance').value);
      const bonus = Number(document.getElementById('m_bonus').value);
      const compPfAdmin = Number(document.getElementById('m_compPfAdmin').value);
      const compPf = Number(document.getElementById('m_compPf').value);
      const compEsic = Number(document.getElementById('m_compEsic').value);

      const tds = Number(document.getElementById('m_tds').value);
      const insurance = Number(document.getElementById('m_insurance').value);
      const lwf = Number(document.getElementById('m_lwf').value);
      const empPf = Number(document.getElementById('m_empPf').value);
      const empEsic = Number(document.getElementById('m_empEsic').value);

      let emp = state.employees.find(x=>x.id===id);
      if(emp){
        emp.name = name;
        emp.role = role;
        emp.designation = designation;
        emp.salary = { basic, hra, education, market, conveyance, bonus, compPfAdmin, compPf, compEsic, tds, insurance, lwf, empPf, empEsic };
      } else {
        const newEmpId = document.getElementById('m_empid').value || ('EMP'+Math.floor(100+Math.random()*900));
        state.employees.push({
          id: newEmpId,
          name, role, designation,
          pass: passInput || '1234',
          status: 'Active',
          department: 'General',
          managerId: 'EMP001',
          salary: { basic, hra, education, market, conveyance, bonus, compPfAdmin, compPf, compEsic, tds, insurance, lwf, empPf, empEsic }
        });
      }
      saveAll(); closeModal(); toast('Employee details updated successfully!'); render();
      return;
    }

    if(t.dataset.appr || t.dataset.rej){
      const req = state.requests.find(r=>r.id===(t.dataset.appr||t.dataset.rej));
      if(req){ req.status = t.dataset.appr ? 'Approved' : 'Rejected'; saveAll(); toast('Leave status updated'); render(); }
      return;
    }
    if(t.dataset.apprloan || t.dataset.rejloan){
      const loan = state.loans.find(l=>l.id===(t.dataset.apprloan||t.dataset.rejloan));
      if(loan){ loan.status = t.dataset.apprloan ? 'Approved' : 'Rejected'; saveAll(); toast('Loan status updated'); render(); }
      return;
    }
    if(t.dataset.apprreg || t.dataset.rejreg){
      const rg = state.regularizations.find(r=>r.id===(t.dataset.apprreg||t.dataset.rejreg));
      if(rg){ rg.status = t.dataset.apprreg ? 'Approved' : 'Rejected'; saveAll(); toast('Regularization status updated'); render(); }
      return;
    }

    if(t.id==='modalBack') closeModal();
  };
}

function processAttendance(empId, today, nowIso, act, loc='Raipur'){
  let rec = state.attendance.find(a=>a.employeeId===empId && a.date===today);
  if(act==='checkin'){
    if(!rec){
      state.attendance.push({ id: genId(), employeeId: empId, date: today, checkIn: nowIso, checkOut: null, location: loc, status:'present' });
      toast('Checked In at ' + loc);
    }
  } else {
    if(rec && !rec.checkOut){
      rec.checkOut = nowIso;
      toast('Checked Out Successfully!');
    }
  }
  saveAll(); render();
}

initData(); render();
</script>
<div id="modalRoot"></div>
</body>
</html>
